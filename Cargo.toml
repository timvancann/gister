[package]
name = "gister"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
git2 = "0.21.0"
itertools = "0.15.0"
ollama-rs = "0.3.6"
owo-colors = "4.3.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
termimad = "0.35.1"
tokio = { version = "1.53.1", features = ["full"] }

[net]
git-fetch-with-cli = true

[package.metadata.release]
publish = false
push = true
